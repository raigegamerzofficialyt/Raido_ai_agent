name: Build JARVIS Android APK

on:
  push:
    branches: [add-jarvis, main]
    paths: ["jarvis/android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: jarvis/android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp jarvis/android/app/build/outputs/apk/debug/app-debug.apk jarvis-assistant.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-assistant-apk
          path: jarvis-assistant.apk
      - name: Publish to a Release (direct download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-apk-latest
          name: JARVIS Android APK (latest build)
          body: "Debug-signed build of the JARVIS assistant. Install, open the app, add your own Gemini key. Built from commit ${{ github.sha }}."
          prerelease: true
          files: jarvis-assistant.apk
