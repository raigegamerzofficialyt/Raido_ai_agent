<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --line:#2b3540; --fg:#e8edf2; --dim:#8b98a5; --acc:#4cc2ff; --ok:#3ecf8e; --bad:#ff6b6b; --warn:#ffb84d; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f7fa; --card:#fff; --line:#d9e0e7; --fg:#18222c; --dim:#5d6b79; --acc:#0a7bc4; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui,sans-serif; display:flex; flex-direction:column; height:100dvh; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  header b { letter-spacing:.12em; color:var(--acc); }
  #stat { font-size:12px; color:var(--dim); }
  nav { display:flex; overflow-x:auto; border-bottom:1px solid var(--line); }
  nav button { flex:1; min-width:84px; padding:10px 6px; background:none; border:0; color:var(--dim); font:inherit; font-size:14px; border-bottom:2px solid transparent; }
  nav button.on { color:var(--fg); border-color:var(--acc); }
  main { flex:1; overflow-y:auto; padding:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .me { border-left:3px solid var(--acc); } .bot { border-left:3px solid var(--ok); }
  .dim { color:var(--dim); font-size:13px; } .pre { white-space:pre-wrap; word-break:break-word; }
  .pill { font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); margin-left:6px; }
  .done,.executed { color:var(--ok); } .failed,.denied { color:var(--bad); } .running,.waiting_approval,.pending { color:var(--warn); }
  button.act { padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; margin:4px 6px 0 0; }
  button.go { background:var(--ok); color:#06130c; border-color:var(--ok); } button.no { background:var(--bad); color:#210606; border-color:var(--bad); }
  form { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
  textarea, input { flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; }
  textarea { resize:none; height:46px; }
  form button { padding:0 18px; border-radius:10px; border:0; background:var(--acc); color:#04141f; font-weight:600; font:inherit; }
  a { color:var(--acc); }
  #voice { display:flex; gap:8px; align-items:center; padding:6px 10px; border-top:1px solid var(--line); font-size:13px; }
  #voice select { flex:none; padding:6px; height:auto; }
  #voice button.act { margin:0; padding:6px 10px; } #voice button.on { background:var(--ok); color:#06130c; border-color:var(--ok); }
  #vstat { color:var(--dim); flex:1; min-width:0; }
  #mic { flex:none; width:52px; height:52px; border-radius:50%; border:0; background:var(--card); border:1px solid var(--line); font-size:24px; padding:0; }
  #mic.live { background:var(--bad); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.1); } }
</style>
</head>
<body>
<header><b>JARVIS</b><span id="stat">...</span></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="voice"><button type="button" id="vmode" class="act">Voice mode: OFF</button>
<select id="vlang" aria-label="Voice language"><option value="hinglish">Hinglish</option><option value="hindi">हिन्दी</option><option value="english">English</option></select>
<span id="vstat"></span></div>
<form id="form"><button type="button" id="mic" aria-label="Bolo">🎤</button><textarea id="box" placeholder="Mic dabao aur bolo, ya yahan likho..." enterkeyhint="send"></textarea><button type="submit">Bhejo</button></form>
<script>
"use strict";
const qs = new URLSearchParams(location.hash.slice(1));
const autoVoice = qs.get("voice") === "1";
if (qs.get("token")) { try { localStorage.setItem("jt", qs.get("token")); } catch (e) {} history.replaceState(null, "", location.pathname); }
if (autoVoice) history.replaceState(null, "", location.pathname);
let TOKEN = ""; try { TOKEN = localStorage.getItem("jt") || ""; } catch (e) {}
const TABS = ["Chat","Tasks","Approvals","Memory","Clients","Files"];
let tab = "Chat", watching = null, chat = [];

async function api(path, opts = {}) {
  const r = await fetch("/api/" + path, { ...opts, headers: { "X-Jarvis-Token": TOKEN, "Content-Type": "application/json" } });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function card(cls, ...kids) { const c = el("div", "card " + (cls || "")); kids.forEach(k => c.append(k)); return c; }
function btn(label, cls, fn) { const b = el("button", "act " + (cls || ""), label); b.onclick = fn; return b; }

function drawNav() {
  const nav = document.getElementById("nav"); nav.replaceChildren();
  TABS.forEach(t => { const b = el("button", t === tab ? "on" : "", t); b.onclick = () => { tab = t; drawNav(); render(); }; nav.append(b); });
}
async function status() {
  try {
    const s = await api("status");
    document.getElementById("stat").textContent = (s.has_api_key ? "key OK" : "NO API KEY") + " | tokens " + s.tokens_today + "/" + s.token_limit + (s.busy ? " | busy" : "");
  } catch (e) { document.getElementById("stat").textContent = "link galat? (token)"; }
}
async function render() {
  const m = document.getElementById("main"); m.replaceChildren();
  try {
    if (tab === "Chat") {
      if (!chat.length) m.append(card("", el("div", "pre", "Namaste! Example: 'JARVIS, mere project ki progress bata' ya 'potential video-editing clients research kar'.")));
      chat.forEach(c => m.append(card(c.who === "me" ? "me" : "bot", el("div", "pre", c.text))));
      m.scrollTop = m.scrollHeight;
    } else if (tab === "Tasks") {
      for (const t of await api("tasks")) {
        const head = el("div", "", "#" + t.id + " " + t.title); const p = el("span", "pill " + t.status, t.status); head.append(p);
        const c = card("", head); c.append(btn("Details", "", async () => { const d = await api("tasks/" + t.id); alert(d.events.map(e => e.kind + ": " + e.text).join("\n\n").slice(0, 3000)); })); m.append(c);
      }
    } else if (tab === "Approvals") {
      const list = await api("approvals"); if (!list.length) m.append(card("", el("div", "dim", "Koi approval request nahi.")));
      list.forEach(a => {
        const c = card("", el("div", "", "#" + a.id + " " + a.summary), el("div", "dim", a.tool + " | " + a.status));
        if (a.result) c.append(el("div", "dim pre", a.result.slice(0, 300)));
        if (a.status === "pending") {
          c.append(btn("Approve", "go", async () => { await api("approvals/" + a.id, { method: "POST", body: JSON.stringify({ approve: true }) }); render(); }));
          c.append(btn("Deny", "no", async () => { await api("approvals/" + a.id, { method: "POST", body: JSON.stringify({ approve: false }) }); render(); }));
        }
        m.append(c);
      });
    } else if (tab === "Memory") {
      const mem = await api("memory"); if (!mem.length) m.append(card("", el("div", "dim", "Memory khaali hai.")));
      mem.forEach(x => { const c = card("", el("b", "", x.key), el("div", "pre", x.value)); c.append(btn("Bhulao", "no", async () => { await api("memory/" + encodeURIComponent(x.key), { method: "DELETE" }); render(); })); m.append(c); });
      m.append(btn("Poori chat history clear karo", "", async () => { if (confirm("Conversation history delete?")) { await api("conversation/clear", { method: "POST", body: "{}" }); chat = []; } }));
    } else if (tab === "Clients") {
      const list = await api("prospects"); if (!list.length) m.append(card("", el("div", "dim", "Abhi koi prospect nahi.")));
      list.forEach(p => {
        const c = card("", el("b", "", p.name), el("span", "pill", p.status), el("div", "dim", [p.niche, p.website, "score " + (p.score ?? "-")].filter(Boolean).join(" | ")),
          el("div", "dim", "contact: " + (p.public_contact || "-") + (p.contact_source ? "  (source: " + p.contact_source + ")" : "")),
          el("div", "dim", "follow-up: " + (p.next_followup || "-")));
        ["contacted", "replied", "won", "lost"].forEach(s => c.append(btn(s, "", async () => { await api("prospects/" + p.id + "/status", { method: "POST", body: JSON.stringify({ status: s }) }); render(); })));
        m.append(c);
      });
    } else if (tab === "Files") {
      const files = await api("outputs"); if (!files.length) m.append(card("", el("div", "dim", "Output folder khaali hai.")));
      files.forEach(f => { const a = el("a", "", f); a.href = "/files/" + f.split("/").map(encodeURIComponent).join("/") + "?t=" + encodeURIComponent(TOKEN); a.target = "_blank"; m.append(card("", a)); });
    }
  } catch (e) { m.append(card("", el("div", "failed", "Error: " + e.message))); }
}
async function watch(id) {
  watching = id;
  while (watching === id) {
    const t = await api("tasks/" + id).catch(() => null);
    if (t && t.status !== "running") {
      watching = null;
      const out = (t.reply || "(no reply)") + (t.status === "waiting_approval" ? "\n\n[Approvals tab me confirm karo]" : "");
      chat.push({ who: "bot", text: out });
      if (tab === "Chat") render(); status(); return out;
    }
    await new Promise(r => setTimeout(r, 2000));
  }
}
// ---------------------------------------------------------------- chat + voice
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const RECLANG = { hinglish: "hi-IN", hindi: "hi-IN", english: "en-IN" };
const TTSLANG = { hinglish: "en-IN", hindi: "hi-IN", english: "en-IN" };
let vlang = "hinglish"; try { vlang = localStorage.getItem("vl") || "hinglish"; } catch (e) {}
let handsFree = false, rec = null, listening = false, misses = 0, wakeLock = null;
const $ = id => document.getElementById(id);
function vstat(t) { $("vstat").textContent = t; }
function syncVoiceUI() {
  $("vmode").textContent = "Voice mode: " + (handsFree ? "ON" : "OFF"); $("vmode").classList.toggle("on", handsFree);
  $("mic").classList.toggle("live", listening);
}
async function keepAwake(on) {
  try { if (on && navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); else if (wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (handsFree && document.visibilityState === "visible") keepAwake(true); });
function cleanForSpeech(t) {
  return t.replace(/```[\s\S]*?```/g, " ").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/https?:\/\/\S+/g, " link ")
    .replace(/[*_#`>|~\[\]]/g, " ").replace(/\s+/g, " ").trim();
}
function speak(text, done) {
  const synth = window.speechSynthesis, clean = cleanForSpeech(text);
  if (!synth || !clean) { if (done) done(); return; }
  synth.cancel();
  const sentences = clean.match(/[^.!?।]+[.!?।]*/g) || [clean], chunks = []; let cur = "";
  for (const p of sentences) { if (cur && (cur + p).length > 180) { chunks.push(cur); cur = p; } else cur += p; }
  if (cur) chunks.push(cur);
  const lang = TTSLANG[vlang], voices = synth.getVoices();
  const v = voices.find(x => x.lang.replace("_", "-") === lang) || voices.find(x => x.lang.toLowerCase().startsWith(lang.slice(0, 2)));
  vstat("Bol raha hoon...");
  chunks.forEach((c, i) => {
    const u = new SpeechSynthesisUtterance(c.trim()); u.lang = lang; if (v) u.voice = v;
    if (i === chunks.length - 1) u.onend = u.onerror = () => { if (done) done(); };
    synth.speak(u);
  });
}
function stopVoice() {
  handsFree = false; misses = 0;
  try { if (rec) rec.abort(); } catch (e) {}
  if (window.speechSynthesis) speechSynthesis.cancel();
  keepAwake(false); listening = false; syncVoiceUI();
}
function startListening() {
  if (!SR) { vstat("Is browser me voice input nahi hai. Chrome use karo."); handsFree = false; syncVoiceUI(); return; }
  if (listening) return;
  rec = new SR(); rec.lang = RECLANG[vlang]; rec.interimResults = true; rec.continuous = false;
  let finalText = "", err = "";
  rec.onstart = () => { listening = true; syncVoiceUI(); vstat("Sun raha hoon... boliye"); };
  rec.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
    $("box").value = (finalText + interim).trim();
  };
  rec.onerror = e => { err = e.error || "error"; };
  rec.onend = () => {
    listening = false; syncVoiceUI();
    if (finalText.trim()) { misses = 0; vstat(""); sendText(finalText, true); return; }
    $("box").value = "";
    if (err === "not-allowed" || err === "service-not-allowed") { vstat("Mic permission do: Chrome ka lock icon > Permissions > Microphone > Allow."); stopVoice(); }
    else if (err === "audio-capture") { vstat("Mic nahi mila."); stopVoice(); }
    else if (err === "network") { vstat("Voice ke liye internet chahiye."); stopVoice(); }
    else if (err === "aborted") { /* stopped by user */ }
    else if (handsFree && ++misses < 3) setTimeout(startListening, 300);
    else { vstat("Kuch sunai nahi diya. Mic dabake phir bolo."); stopVoice(); }
  };
  try { rec.start(); } catch (e) { vstat("Mic start nahi hua, phir try karo."); }
}
async function sendText(text, fromVoice) {
  text = text.trim(); if (!text) return;
  $("box").value = ""; chat.push({ who: "me", text }); tab = "Chat"; drawNav(); render();
  const voice = !!(fromVoice || handsFree); let reply = null;
  try {
    const r = await api("chat", { method: "POST", body: JSON.stringify({ text, voice, voice_lang: vlang }) });
    chat.push({ who: "bot", text: "(kaam chal raha hai...)" }); render(); const idx = chat.length - 1;
    if (voice) vstat("Soch raha hoon...");
    reply = await watch(r.task_id); chat.splice(idx, 1); render();
  } catch (err) {
    chat.push({ who: "bot", text: "Error: " + err.message }); render();
    if (voice) { stopVoice(); speak("Error aaya. " + err.message, null); }
    return;
  }
  if (voice && reply) speak(reply, () => { if (handsFree) startListening(); else vstat(""); });
}
$("form").onsubmit = e => { e.preventDefault(); sendText($("box").value, false); };
$("mic").onclick = () => {
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (listening) { try { rec.stop(); } catch (e) {} } else { misses = 0; startListening(); }
};
$("vmode").onclick = () => {
  if (handsFree) { stopVoice(); vstat(""); return; }
  handsFree = true; misses = 0; syncVoiceUI(); keepAwake(true); startListening();
};
$("vlang").value = vlang;
$("vlang").onchange = () => { vlang = $("vlang").value; try { localStorage.setItem("vl", vlang); } catch (e) {} };
drawNav(); render(); status(); setInterval(status, 15000);
if (autoVoice) setTimeout(() => { if (!handsFree) { handsFree = true; misses = 0; syncVoiceUI(); keepAwake(true); startListening(); } }, 400);
</script>
</body>
</html>
